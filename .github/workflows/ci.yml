name: Deploy blog

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Locate Chrome for diagrams
        run: |
          chrome_path=$(command -v google-chrome)
          "$chrome_path" --version
          echo "CHROME_PATH=$chrome_path" >> "$GITHUB_ENV"

      - name: Build blog
        run: npm run build

      - name: Check build output
        run: |
          test -s docs/.vuepress/dist/index.html
          test -s docs/.vuepress/dist/elasticsearch/index.html
          test -s docs/.vuepress/dist/elasticsearch/start/index.html
          test -s docs/.vuepress/dist/diagrams/feign-detail.svg

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/.vuepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
